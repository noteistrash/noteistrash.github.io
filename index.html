<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oklama</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&family=Space+Mono&display=swap');
    body {
      font-family: 'Courier Prime', monospace;
      background-color: #f7f7f5;
      background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden text-neutral-600 select-none flex flex-col justify-between p-6 sm:p-10">

  <!-- Top Navigation -->
  <header class="flex justify-between items-center text-xs tracking-wider">
    <a href="music.html" class="hover:text-black transition">music</a>
    <a href="store.html" class="hover:text-black transition">store &rarr;</a>
    <a href="tour.html" class="hover:text-black transition">tour</a>
  </header>

  <!-- Desktop Grid Links -->
  <main class="grid grid-cols-2 sm:grid-cols-3 gap-8 max-w-xl mx-auto my-auto text-center">
    
    <!-- Nu Thoughts (Classic Manila / Warm Ochre Folder) -->
    <a href="nuthoughts.html" class="group flex flex-col items-center p-3 rounded hover:bg-black/5 transition">
      <svg class="w-12 h-10 mb-2" viewBox="0 0 24 20" fill="none">
        <rect x="1" y="2" width="9" height="3" fill="#d8b248"/>
        <rect x="0" y="4" width="24" height="15" fill="#f5e4a8" stroke="#a48123" stroke-width="1.2"/>
        <line x1="3" y1="8" x2="21" y2="8" stroke="#d4b455" stroke-width="1"/>
        <line x1="3" y1="11" x2="15" y2="11" stroke="#d4b455" stroke-width="1"/>
      </svg>
      <span class="text-xs text-[#8a6b10] group-hover:underline font-semibold">nu thoughts</span>
    </a>

    <!-- Music / Discography (Classic Slate / Grey Folder) -->
    <a href="music.html" class="group flex flex-col items-center p-3 rounded hover:bg-black/5 transition">
      <svg class="w-12 h-10 mb-2" viewBox="0 0 24 20" fill="none">
        <rect x="1" y="2" width="10" height="3" fill="#b0b5be"/>
        <rect x="0" y="4" width="24" height="15" fill="#e2e5eb" stroke="#68707d" stroke-width="1.2"/>
        <circle cx="8" cy="11" r="2" fill="#9fa7b4"/>
        <circle cx="16" cy="11" r="2" fill="#9fa7b4"/>
      </svg>
      <span class="text-xs text-neutral-800 group-hover:underline">discography</span>
    </a>

    <!-- Manifesto Text (Clean White Paper Document) -->
    <a href="manifesto.html" class="group flex flex-col items-center p-3 rounded hover:bg-black/5 transition">
      <svg class="w-10 h-10 mb-2" viewBox="0 0 20 22" fill="none">
        <path d="M1 1H13L19 7V21H1V1Z" fill="#ffffff" stroke="#52525b" stroke-width="1.2"/>
        <path d="M13 1V7H19" stroke="#52525b" stroke-width="1.2" fill="#e4e4e7"/>
        <line x1="4" y1="9" x2="16" y2="9" stroke="#71717a"/>
        <line x1="4" y1="12" x2="16" y2="12" stroke="#a1a1aa"/>
        <line x1="4" y1="15" x2="11" y2="15" stroke="#a1a1aa"/>
      </svg>
      <span class="text-xs text-neutral-800 group-hover:underline">manifesto.txt</span>
    </a>

  </main>

  <!-- Footer / Status Bar -->
  <footer class="flex flex-col sm:flex-row justify-between items-center text-[11px] text-neutral-500 font-mono gap-2">
    <div>oklama // system idle</div>
    
    <div class="space-x-2">
      <a href="https://twitter.com/oklama" target="_blank" class="hover:text-black">twitter</a>
      <span>/</span>
      <a href="https://instagram.com" target="_blank" class="hover:text-black">instagram</a>
      <span>/</span>
      <a href="https://youtube.com" target="_blank" class="hover:text-black">youtube</a>
    </div>

    <div id="clock">00:00:00 UTC</div>
  </footer>

  <script>
    function updateClock() {
      const d = new Date();
      document.getElementById('clock').textContent = 
        `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')} UTC`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
