<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noteistrash</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&family=Space+Mono&display=swap');
    
    body {
      font-family: 'Courier Prime', monospace;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Light Theme (Default) */
    body.theme-light {
      background-color: #f7f7f5;
      background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      color: #525252;
    }
    body.theme-light .nav-link:hover,
    body.theme-light .footer-link:hover {
      color: #000000;
    }
    body.theme-light .footer-bar {
      color: #737373;
    }
    body.theme-light .grid-item:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }
    body.theme-light .item-label-default {
      color: #262626;
    }
    body.theme-light .item-label-nu {
      color: #8a6b10;
    }

    /* Dark Theme */
    body.theme-dark {
      background-color: #09090b;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      color: #a3a3a3;
    }
    body.theme-dark .nav-link:hover,
    body.theme-dark .footer-link:hover {
      color: #ffffff;
    }
    body.theme-dark .footer-bar {
      color: #525252;
    }
    body.theme-dark .grid-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }
    body.theme-dark .item-label-default {
      color: #e5e5e5;
    }
    body.theme-dark .item-label-nu {
      color: #d4af37;
    }

    /* Pixel rendering */
    .pixel-art {
      shape-rendering: crispEdges;
    }
  </style>
</head>
<body class="theme-light h-screen w-screen overflow-hidden select-none flex flex-col justify-between p-6 sm:p-10">

  <!-- Top Navigation with Discreet Toggle -->
  <header class="flex justify-between items-center text-xs tracking-wider">
    <div class="space-x-4">
      <a href="music.html" class="nav-link transition">music</a>
      <a href="social.html" class="nav-link transition">socials &rarr;</a>
      <a href="about.html" class="nav-link transition">what is this?</a>
    </div>

    <!-- Theme Switcher Button -->
    <button 
      id="theme-btn" 
      onclick="toggleTheme()" 
      class="nav-link font-mono opacity-70 hover:opacity-100 transition underline underline-offset-4"
    >[theme: dark]</button>
  </header>

  <!-- Desktop Grid Links -->
  <main class="grid grid-cols-2 sm:grid-cols-3 gap-8 max-w-xl mx-auto my-auto text-center">
    
    <!-- Nu Thoughts -->
    <a href="stuff.html" class="grid-item group flex flex-col items-center p-3 rounded transition">
      <svg class="pixel-art w-12 h-10 mb-2" viewBox="0 0 24 20" fill="none">
        <rect x="1" y="2" width="9" height="3" fill="#d8b248"/>
        <rect x="0" y="4" width="24" height="15" fill="#f5e4a8" stroke="#a48123" stroke-width="1.2"/>
        <line x1="3" y1="8" x2="21" y2="8" stroke="#d4b455" stroke-width="1"/>
        <line x1="3" y1="11" x2="15" y2="11" stroke="#d4b455" stroke-width="1"/>
      </svg>
      <span class="item-label-nu text-xs group-hover:underline font-semibold">stuff</span>
    </a>

    <!-- Music / Discography -->
    <a href="music.html" class="grid-item group flex flex-col items-center p-3 rounded transition">
      <svg class="pixel-art w-12 h-10 mb-2" viewBox="0 0 24 20" fill="none">
        <rect x="1" y="2" width="10" height="3" fill="#b0b5be"/>
        <rect x="0" y="4" width="24" height="15" fill="#e2e5eb" stroke="#68707d" stroke-width="1.2"/>
        <circle cx="8" cy="11" r="2" fill="#9fa7b4"/>
        <circle cx="16" cy="11" r="2" fill="#9fa7b4"/>
      </svg>
      <span class="item-label-default text-xs group-hover:underline">discography</span>
    </a>

    <!-- Manifesto Text -->
    <a href="about.html" class="grid-item group flex flex-col items-center p-3 rounded transition">
      <svg class="pixel-art w-10 h-10 mb-2" viewBox="0 0 20 22" fill="none">
        <path d="M1 1H13L19 7V21H1V1Z" fill="#ffffff" stroke="#52525b" stroke-width="1.2"/>
        <path d="M13 1V7H19" stroke="#52525b" stroke-width="1.2" fill="#e4e4e7"/>
        <line x1="4" y1="9" x2="16" y2="9" stroke="#71717a"/>
        <line x1="4" y1="12" x2="16" y2="12" stroke="#a1a1aa"/>
        <line x1="4" y1="15" x2="11" y2="15" stroke="#a1a1aa"/>
      </svg>
      <span class="item-label-default text-xs group-hover:underline">about.txt</span>
    </a>

  </main>

  <!-- Footer / Status Bar -->
  <footer class="footer-bar flex flex-col sm:flex-row justify-between items-center text-[11px] font-mono gap-2 transition">
    <div>i make music</div>

    <div id="clock">00:00:00 UTC</div>
  </footer>

  <script>
    // Theme Switcher Logic (Persists in localStorage)
    function applyTheme(theme) {
      const body = document.body;
      const btn = document.getElementById('theme-btn');
      if (theme === 'dark') {
        body.classList.remove('theme-light');
        body.classList.add('theme-dark');
        btn.textContent = '[theme: light]';
      } else {
        body.classList.remove('theme-dark');
        body.classList.add('theme-light');
        btn.textContent = '[theme: dark]';
      }
      localStorage.setItem('homescreen-theme', theme);
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains('theme-dark');
      applyTheme(isDark ? 'light' : 'dark');
    }

    const savedTheme = localStorage.getItem('homescreen-theme') || 'light';
    applyTheme(savedTheme);

    // Clock
    function updateClock() {
      const d = new Date();
      document.getElementById('clock').textContent = 
        `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')} UTC`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
