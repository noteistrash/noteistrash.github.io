<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 / noteistrash</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Mono&display=swap');

    body {
      font-family: 'Courier Prime', monospace;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Light Theme (matches homepage) */
    body.theme-light {
      background-color: #f8f8ff;
      background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      color: #262626;
    }
    body.theme-light .nav-link {
      color: #262626;
    }
    body.theme-light .nav-link:hover {
      color: #000000;
    }
    body.theme-light .error-code {
      color: #a3a3a3;
    }
    body.theme-light .sub-text {
      color: #525252;
    }

    /* Dark Theme (matches homepage) */
    body.theme-dark {
      background-color: #09090b;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      color: #a3a3a3;
    }
    body.theme-dark .nav-link {
      color: #e5e5e5;
    }
    body.theme-dark .nav-link:hover {
      color: #ffffff;
    }
    body.theme-dark .error-code {
      color: #525252;
    }
    body.theme-dark .sub-text {
      color: #71717a;
    }
  </style>
</head>
<body class="theme-light h-screen w-screen overflow-hidden select-none flex flex-col justify-between p-6 sm:p-10">

  <!-- Top Navigation -->
  <header class="flex justify-between items-center font-mono text-sm sm:text-base tracking-tight">
    <div class="space-x-4">
      <a href="index.html" class="nav-link font-bold hover:underline">&larr; home</a>
    </div>

    <!-- Theme Switcher Button -->
    <button 
      id="theme-btn" 
      onclick="toggleTheme()" 
      class="nav-link font-mono text-xs opacity-70 hover:opacity-100 transition underline underline-offset-4"
    >[theme: dark]</button>
  </header>

  <!-- Error Message Container -->
  <main class="max-w-xl mx-auto my-auto text-center font-mono space-y-6 px-4">
    <div class="error-code text-xs sm:text-sm tracking-widest uppercase">
      [ error // 404 ]
    </div>

    <p class="text-base sm:text-lg leading-relaxed">
      this page doesn't exist. it has probably been removed, moved or is temporarily unavailable.
    </p>

    <p class="sub-text text-sm sm:text-base leading-relaxed">
      ... or maybe i touched something that i <i>shouldn't</i> have touched.
    </p>
  </main>

  <!-- Clean Footer (Clock only, no status bar) -->
  <footer class="flex justify-end items-center text-xs font-mono pt-4 opacity-75">
    <div id="clock">00:00:00 UTC</div>
  </footer>

  <script>
    // Theme Switcher Logic (Shared with homescreen-theme key)
    function applyTheme(theme) {
      const body = document.body;
      const btn = document.getElementById('theme-btn');
      if (theme === 'dark') {
        body.classList.remove('theme-light');
        body.classList.add('theme-dark');
        btn.textContent = '[theme: light]';
      } else {
        body.classList.remove('theme-dark');
        body.classList.add('theme-light');
        btn.textContent = '[theme: dark]';
      }
      localStorage.setItem('homescreen-theme', theme);
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains('theme-dark');
      applyTheme(isDark ? 'light' : 'dark');
    }

    const savedTheme = localStorage.getItem('homescreen-theme') || 'light';
    applyTheme(savedTheme);

    // Clock
    function updateClock() {
      const d = new Date();
      document.getElementById('clock').textContent = 
        `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')} UTC`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
