<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>socials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Mono&display=swap');
    body {
      font-family: 'Courier Prime', monospace;
      background-color: #f6e3b4;
      border: 18px solid #ff7a59;
    }
    .pixel-art {
      shape-rendering: crispEdges;
      image-rendering: pixelated;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden text-neutral-800 select-none flex flex-col justify-between p-6 sm:p-10">

  <!-- Spacer to keep center balanced -->
  <div class="hidden sm:block opacity-0 pointer-events-none"></div>

  <!-- Center Card Container -->
  <main class="w-full max-w-2xl mx-auto my-auto flex flex-col items-center">
    
    <!-- Directory Window / Address Bar -->
    <div class="w-full bg-white border-2 border-black px-4 py-2.5 flex items-center gap-3 shadow-[3px_3px_0px_rgba(0,0,0,1)]">
      <!-- Folder Icon -->
      <svg class="pixel-art w-7 h-6 flex-shrink-0" viewBox="0 0 24 20" fill="none">
        <rect x="1" y="2" width="9" height="3" fill="#d8b248"/>
        <rect x="0" y="4" width="24" height="15" fill="#f5e4a8" stroke="#000000" stroke-width="1.5"/>
        <line x1="3" y1="8" x2="21" y2="8" stroke="#d4b455" stroke-width="1"/>
      </svg>
      <span class="font-mono text-sm sm:text-base tracking-tight text-black font-bold">noteistrash.github.io/socials/</span>
    </div>

    <!-- Centered List Links -->
    <div class="w-full pt-8 pl-4 sm:pl-8 space-y-6 font-mono text-base sm:text-lg">
      <!-- Parent Directory -->
      <div>
        <a href="index.html" class="hover:underline text-black font-bold">../</a>
      </div>

      <!-- YouTube -->
      <div class="pl-8 sm:pl-12">
        <a href="https://www.youtube.com/@noteistrash" target="_blank" class="inline-flex items-center gap-4 hover:underline group">
          <!-- CRT Screen SVG Icon -->
          <svg class="pixel-art w-8 h-7 flex-shrink-0" viewBox="0 0 24 20" fill="none">
            <rect x="1" y="2" width="22" height="15" fill="#e8d5d5" stroke="#992b2b" stroke-width="1.2"/>
            <rect x="3" y="4" width="18" height="11" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1"/>
            <rect x="10" y="6" width="2" height="7" fill="#ffffff"/>
            <rect x="12" y="7" width="2" height="5" fill="#ffffff"/>
            <rect x="14" y="8" width="2" height="3" fill="#ffffff"/>
            <rect x="16" y="9" width="1" height="1" fill="#ffffff"/>
            <rect x="9" y="17" width="6" height="2" fill="#c4b5b5" stroke="#7f1d1d" stroke-width="1"/>
          </svg>
          <span class="text-neutral-900 group-hover:text-black">youtube</span>
        </a>
      </div>

      <!-- SoundCloud -->
      <div class="pl-8 sm:pl-12">
        <a href="https://soundcloud.com/noteistrash" target="_blank" class="inline-flex items-center gap-4 hover:underline group">
          <!-- Waveform Cassette SVG Icon -->
          <svg class="pixel-art w-8 h-7 flex-shrink-0" viewBox="0 0 24 20" fill="none">
            <rect x="1" y="3" width="22" height="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
            <rect x="4" y="6" width="16" height="8" fill="#ffffff" stroke="#c2410c" stroke-width="1"/>
            <rect x="6" y="10" width="1" height="2" fill="#ea580c"/>
            <rect x="8" y="9" width="1" height="3" fill="#ea580c"/>
            <rect x="10" y="7" width="1" height="5" fill="#ea580c"/>
            <rect x="12" y="8" width="1" height="4" fill="#ea580c"/>
            <rect x="14" y="7" width="1" height="5" fill="#ea580c"/>
            <rect x="16" y="9" width="1" height="3" fill="#ea580c"/>
            <rect x="7" y="11" width="1" height="1" fill="#7c2d12"/>
            <rect x="15" y="11" width="1" height="1" fill="#7c2d12"/>
          </svg>
          <span class="text-neutral-900 group-hover:text-black">soundcloud</span>
        </a>
      </div>

      <!-- Bandcamp -->
      <div class="pl-8 sm:pl-12">
        <a href="https://noteistrash.bandcamp.com/track/pilot" target="_blank" class="inline-flex items-center gap-4 hover:underline group">
          <!-- Parallelogram Plate SVG Icon -->
          <svg class="pixel-art w-8 h-7 flex-shrink-0" viewBox="0 0 24 20" fill="none">
            <rect x="1" y="2" width="22" height="16" fill="#e6fffa" stroke="#0d9488" stroke-width="1.2"/>
            <rect x="7" y="5" width="10" height="2" fill="#0d9488"/>
            <rect x="6" y="7" width="10" height="2" fill="#0d9488"/>
            <rect x="5" y="9" width="10" height="2" fill="#0d9488"/>
            <rect x="4" y="11" width="10" height="2" fill="#0d9488"/>
            <line x1="3" y1="15" x2="21" y2="15" stroke="#14b8a6" stroke-width="1"/>
          </svg>
          <span class="text-neutral-900 group-hover:text-black">bandcamp</span>
        </a>
      </div>
    </div>

  </main>

  <!-- Status Bar Footer -->
  <footer class="flex flex-col sm:flex-row justify-between items-center text-xs text-neutral-700 font-mono gap-2 pt-4">
    <div>i make music</div>

    <div id="clock">00:00:00 UTC</div>
  </footer>

  <script>
    function updateClock() {
      const d = new Date();
      document.getElementById('clock').textContent = 
        `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')} UTC`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
