<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noteistrash / socials</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

    body {
      font-family: 'Courier Prime', monospace;
      background-color: #f8f8ff;
      background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .pixel-art {
      shape-rendering: crispEdges;
      image-rendering: pixelated;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden text-neutral-600 select-none flex flex-col justify-between p-6 sm:p-10">

  <!-- Top Navigation (Identical system header) -->
  <header class="flex justify-between items-center text-xs tracking-wider">
    <a href="index.html" class="hover:text-black transition">&larr; home</a>
    <span class="text-neutral-400 font-mono text-[11px]">/socials</span>
    <span class="text-neutral-400 font-mono text-[11px] opacity-0 pointer-events-none">&larr; home</span>
  </header>

  <!-- Desktop Icons (Matched scale, 3-column layout & micro-interactions) -->
  <main class="grid grid-cols-1 sm:grid-cols-3 gap-10 max-w-2xl mx-auto my-auto text-center w-full">
    
    <!-- YouTube -->
    <a href="https://www.youtube.com/@noteistrash" target="_blank" class="group flex flex-col items-center p-4 rounded hover:bg-black/5 transition">
      <svg class="pixel-art w-14 h-12 mb-3" viewBox="0 0 24 20" fill="none">
        <rect x="1" y="2" width="22" height="15" fill="#fce8e8" stroke="#992b2b" stroke-width="1.2"/>
        <rect x="3" y="4" width="18" height="11" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1"/>
        <rect x="10" y="6" width="2" height="7" fill="#ffffff"/>
        <rect x="12" y="7" width="2" height="5" fill="#ffffff"/>
        <rect x="14" y="8" width="2" height="3" fill="#ffffff"/>
        <rect x="16" y="9" width="1" height="1" fill="#ffffff"/>
        <rect x="9" y="17" width="6" height="2" fill="#d1b8b8" stroke="#7f1d1d" stroke-width="1"/>
      </svg>
      <span class="text-xs text-[#992b2b] group-hover:underline font-semibold tracking-wider">youtube</span>
    </a>

    <!-- SoundCloud -->
    <a href="https://soundcloud.com/noteistrash" target="_blank" class="group flex flex-col items-center p-4 rounded hover:bg-black/5 transition">
      <svg class="pixel-art w-14 h-12 mb-3" viewBox="0 0 24 20" fill="none">
        <rect x="1" y="3" width="22" height="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
        <rect x="4" y="6" width="16" height="8" fill="#ffffff" stroke="#c2410c" stroke-width="1"/>
        <rect x="6" y="10" width="1" height="2" fill="#ea580c"/>
        <rect x="8" y="9" width="1" height="3" fill="#ea580c"/>
        <rect x="10" y="7" width="1" height="5" fill="#ea580c"/>
        <rect x="12" y="8" width="1" height="4" fill="#ea580c"/>
        <rect x="14" y="7" width="1" height="5" fill="#ea580c"/>
        <rect x="16" y="9" width="1" height="3" fill="#ea580c"/>
        <rect x="7" y="11" width="1" height="1" fill="#7c2d12"/>
        <rect x="15" y="11" width="1" height="1" fill="#7c2d12"/>
      </svg>
      <span class="text-xs text-[#c2410c] group-hover:underline font-semibold tracking-wider">soundcloud</span>
    </a>

    <!-- Bandcamp -->
    <a href="https://noteistrash.bandcamp.com/track/pilot" target="_blank" class="group flex flex-col items-center p-4 rounded hover:bg-black/5 transition">
      <svg class="pixel-art w-14 h-12 mb-3" viewBox="0 0 24 20" fill="none">
        <rect x="1" y="2" width="22" height="16" fill="#e6fffa" stroke="#0d9488" stroke-width="1.2"/>
        <rect x="7" y="5" width="10" height="2" fill="#0d9488"/>
        <rect x="6" y="7" width="10" height="2" fill="#0d9488"/>
        <rect x="5" y="9" width="10" height="2" fill="#0d9488"/>
        <rect x="4" y="11" width="10" height="2" fill="#0d9488"/>
        <line x1="3" y1="15" x2="21" y2="15" stroke="#14b8a6" stroke-width="1"/>
      </svg>
      <span class="text-xs text-[#0f766e] group-hover:underline font-semibold tracking-wider">bandcamp</span>
    </a>

  </main>

  <!-- Status Bar Footer (Exact match) -->
  <footer class="flex flex-col sm:flex-row justify-between items-center text-[11px] text-neutral-500 font-mono gap-2">
    <div>i make music</div>
    
    <div class="space-x-2">
      <a href="https://noteistrash.bandcamp.com/" target="_blank" class="hover:text-black">bandcamp</a>
      <span>/</span>
      <a href="https://soundcloud.com/noteistrash" target="_blank" class="hover:text-black">soundcloud</a>
      <span>/</span>
      <a href="https://www.youtube.com/@noteistrash" target="_blank" class="hover:text-black">youtube</a>
    </div>

    <div id="clock">00:00:00 UTC</div>
  </footer>

  <script>
    function updateClock() {
      const d = new Date();
      document.getElementById('clock').textContent = 
        `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')} UTC`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
