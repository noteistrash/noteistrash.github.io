<body class="min-h-screen w-screen text-white select-none flex flex-col justify-between p-6 sm:p-10">

  <!-- Navbar -->
  <header class="flex justify-between items-center font-mono text-sm sm:text-base tracking-tight">
    <a href="index.html" class="hover:underline text-white font-bold">← home</a>
    <span class="text-neutral-500 font-mono text-xs sm:text-sm">pilot.txt</span>
  </header>

  <!-- Centered Journal Content -->
  <main class="w-full max-w-2xl mx-auto my-auto py-12 text-center font-mono text-base sm:text-lg space-y-8 leading-relaxed">
    
    <div class="text-xs sm:text-sm text-neutral-400 tracking-widest uppercase">
     pilot
    </div>

    <div>
      <ol class="list-decimal list-inside text-left inline-block space-y-2">
        <li><u><a href="https://youtu.be/e_4aHYC1QAg?si=s7r7dvxgcKkVw0Hz" class="hover:text-neutral-300">youtube</a></u></li>
        <li><u><a href="https://soundcloud.com/noteistrash" class="hover:text-neutral-300">soundcloud</a></u></li>
        <li><u><a href="https://noteistrash.bandcamp.com/track/pilot" class="hover:text-neutral-300">bandcamp</a></u></li>
      </ol>
    </div>

    <div>
      <span class="text-white font-bold mt-2 inline-block">first full song that i <i>ever</i> made btw.</span>
    </div>

    <div class="pt-6 text-sm text-neutral-400">
      click or tap on the website name(s) to go to the song on that specific website
    </div>
  </main>

  <!-- Status Bar Footer -->
  <footer class="flex flex-col sm:flex-row justify-between items-center text-xs text-neutral-400 font-mono gap-2 pt-4">
    <div>i make music</div>
    <div id="clock">16:08:08 UTC</div>
  </footer>

  <script>
    function updateClock() {
      const d = new Date();
      document.getElementById('clock').textContent = 
        `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')} UTC`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
